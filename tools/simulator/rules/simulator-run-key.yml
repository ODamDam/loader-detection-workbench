title: Run key value written by a process started from the Workbench run directory
id: 8e2c4f61-7b3a-4d0e-9a15-3c6b2d8f1e47
status: experimental
description: Rehearsal rule for the benign simulator; a dropped executable sets HKCU Run.
logsource:
  product: windows
  category: registry_set
detection:
  selection:
    EventID: 13
    TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Run\'
    Image|contains: '\WorkbenchRun\'
  condition: selection
level: medium
